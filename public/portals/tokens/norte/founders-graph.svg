<!-- Norte Token: founders graph (a little network of star-headed founders). Sticker style: white die-cut edge, soft shadow, 3 px ink outline, Norte palette. -->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 100 100">
<defs>
<path id="links" d="M52 54L24 26M52 54L78 22M52 54L22 78M52 54L80 76M24 26L78 22M24 26L22 78M78 22L80 76"/>
<g id="nodes"><circle cx="52" cy="54" r="15"/><circle cx="24" cy="26" r="12"/><circle cx="78" cy="22" r="12"/><circle cx="22" cy="78" r="10"/><circle cx="80" cy="76" r="13"/></g>
<g id="cut" stroke-linecap="round" stroke-linejoin="round"><use href="#links" fill="none" stroke-width="7"/><use href="#nodes" stroke-width="9"/></g>
<clipPath id="disc"><circle r="9.3"/></clipPath>
<!-- One founder in a node 10 wide: shirt (currentColor), spiky star head, little face -->
<g id="founder" clip-path="url(#disc)" stroke="#1d1a10" stroke-linejoin="round" stroke-linecap="round">
<path d="M-7.5 11C-7.5 5-4 3 0 3S7.5 5 7.5 11Z" fill="currentColor" stroke-width="1"/>
<path d="M0.00 -9.10L1.50 -6.63L4.24 -7.56L3.81 -4.70L6.50 -3.65L4.33 -1.74L5.72 0.80L2.83 0.87L2.26 3.70L0.00 1.90L-2.26 3.70L-2.83 0.87L-5.72 0.80L-4.33 -1.74L-6.50 -3.65L-3.81 -4.70L-4.24 -7.56L-1.50 -6.63Z" fill="#f2c200" stroke-width="1"/>
<circle cx="-1.5" cy="-3" r=".55" fill="#1d1a10" stroke="none"/><circle cx="1.5" cy="-3" r=".55" fill="#1d1a10" stroke="none"/>
<path d="M-1.3 -1.3Q0 -.3 1.3 -1.3" fill="none" stroke-width=".7"/>
</g>
</defs>
<use href="#cut" transform="translate(1.5 2.5)" fill="#1d1a10" stroke="#1d1a10" opacity=".22"/>
<use href="#cut" class="sticker-edge" fill="#fff" stroke="#fff"/>
<use href="#links" fill="none" stroke="#1d1a10" stroke-width="3.6" stroke-linecap="round"/>
<use href="#links" fill="none" stroke="#f2c200" stroke-width="1.6" stroke-linecap="round"/>
<g stroke="#1d1a10" stroke-width="2.5">
<circle cx="52" cy="54" r="15" fill="#a87400"/><circle cx="24" cy="26" r="12" fill="#e39400"/><circle cx="78" cy="22" r="12" fill="#2b2b2b"/><circle cx="22" cy="78" r="10" fill="#7fd3ff"/><circle cx="80" cy="76" r="13" fill="#e39400"/>
</g>
<use href="#founder" color="#fff" transform="translate(52 54) scale(1.5)"/>
<use href="#founder" color="#7fd3ff" transform="translate(24 26) scale(1.2)"/>
<use href="#founder" color="#fff" transform="translate(78 22) scale(1.2)"/>
<use href="#founder" color="#e39400" transform="translate(22 78)"/>
<use href="#founder" color="#7fd3ff" transform="translate(80 76) scale(1.3)"/>
<use href="#nodes" fill="none" stroke="#1d1a10" stroke-width="2.5"/>
</svg>
